<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Sujeitogram - A sua rede social</title>
</head>

<body>
  <div class="wrapper">
    <div class="container">
      <div class="column left"></div>
      <div class="column right">
        <div class="login-panel">
          <div class="logo">
            <img src="assets/logo.png" alt="Logo Sujeitogram">
          </div>
          <form>
            <input type="text" name="username" placeholder="Telefone, usuário ou e-mail">
            <input type="password" name="senha" placeholder="Senha">
            <input type="submit" value="Entrar">
          </form>
        </div>
        <div class="infobox">
          <p>Não possui uma conta? <a href="signup.html">Cadastre-se</a></p>
        </div>
        <div class="apps-downloads">
          <p>Obtenha o aplicativo</p>
          <div class="apps">
            <img src="assets/googleplay.png" alt="Instalar aplicativo na playstore">
            <img src="assets/appstore.png" alt="Instalar aplicativo na appstore">
          </div>
        </div>
      </div>
    </div>
    <footer>
      <div class="footer-inner">
        <a href="#">about us</a>
        <a href="#">support</a>
        <a href="#">blog</a>
        <a href="#">press</a>
        <a href="#">api</a>
        <a href="#">jobs</a>
        <a href="#">privacy</a>
        <a href="#">terms</a>
        <a href="#">directory</a>
        <a href="#">profiles</a>
        <a href="#">hashtags</a>
        <a href="#">language</a>
        <div class="text-small">
          @ 2026 Sujeitogram
        </div>
      </div>
    </footer>
  </div>
</body>

</html>
